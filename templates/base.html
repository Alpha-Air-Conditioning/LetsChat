{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}LetsChat{% endblock %}</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v3 Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        zinc: {
                            850: '#1e1e24',
                            900: '#141417',
                            925: '#0f0f12',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html {
            height: 100%;
            background-color: #09090b;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #09090b;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #conversationList, #messages, .overflow-y-auto {
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
        }

        /* Clean minimal scrollbars */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }

        /* Input styling */
        input:focus {
            outline: none;
        }

        /* Sound Wave Animation Keyframes */
        @keyframes soundWaveAnim {
            0%, 100% { height: 4px; }
            50% { height: 18px; }
        }
        .animate-wave-1 { animation: soundWaveAnim 0.6s ease-in-out infinite; }
        .animate-wave-2 { animation: soundWaveAnim 0.4s ease-in-out infinite 0.1s; }
        .animate-wave-3 { animation: soundWaveAnim 0.7s ease-in-out infinite 0.2s; }
        .animate-wave-4 { animation: soundWaveAnim 0.5s ease-in-out infinite 0.3s; }
        .animate-wave-5 { animation: soundWaveAnim 0.8s ease-in-out infinite 0.15s; }
        .animate-wave-6 { animation: soundWaveAnim 0.45s ease-in-out infinite 0.25s; }
        .animate-wave-7 { animation: soundWaveAnim 0.65s ease-in-out infinite 0.35s; }
    </style>
</head>

<body class="bg-[#09090b] text-zinc-100 font-sans min-h-screen antialiased selection:bg-blue-600/30 selection:text-blue-200">
    <!-- Global Floating Toast Notification -->
    <div id="globalToast" class="fixed top-5 left-1/2 -translate-x-1/2 z-[9999] pointer-events-none transition-all duration-300 transform -translate-y-12 opacity-0 flex items-center gap-2 px-4 py-2.5 rounded-xl bg-zinc-900/95 border border-zinc-700/80 shadow-2xl backdrop-blur-md text-xs font-medium text-zinc-100">
        <svg class="w-4 h-4 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span id="globalToastText">Copied to clipboard</span>
    </div>

    {% block content %}
    {% endblock %}

    <script>
        let toastTimeout = null;
        function showGlobalToast(message, isError = false) {
            const toast = document.getElementById('globalToast');
            const text = document.getElementById('globalToastText');
            if (!toast || !text) return;

            text.textContent = message;
            if (isError) {
                toast.classList.remove('border-zinc-700/80', 'text-zinc-100');
                toast.classList.add('border-rose-500/50', 'text-rose-200');
            } else {
                toast.classList.remove('border-rose-500/50', 'text-rose-200');
                toast.classList.add('border-zinc-700/80', 'text-zinc-100');
            }

            toast.classList.remove('-translate-y-12', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-12', 'opacity-0');
            }, 2200);
        }

        window.copyTextToClipboard = function(text, successMsg = 'Copied to clipboard!', showToast = true) {
            if (!text) return;
            const str = String(text).trim();

            function executeFallback() {
                try {
                    const textArea = document.createElement('textarea');
                    textArea.value = str;
                    textArea.style.position = 'fixed';
                    textArea.style.top = '0';
                    textArea.style.left = '0';
                    textArea.style.width = '2em';
                    textArea.style.height = '2em';
                    textArea.style.padding = '0';
                    textArea.style.border = 'none';
                    textArea.style.outline = 'none';
                    textArea.style.boxShadow = 'none';
                    textArea.style.background = 'transparent';
                    textArea.style.opacity = '0';
                    textArea.setAttribute('readonly', '');
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    textArea.setSelectionRange(0, 99999);
                    const successful = document.execCommand('copy');
                    document.body.removeChild(textArea);
                    if (successful && showToast && successMsg) {
                        showGlobalToast(successMsg);
                    }
                } catch (err) {
                    console.error('Copy fallback error:', err);
                }
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(str)
                    .then(() => {
                        if (showToast && successMsg) {
                            showGlobalToast(successMsg);
                        }
                    })
                    .catch(() => {
                        executeFallback();
                    });
            } else {
                executeFallback();
            }
        };
    </script>
</body>
</html>
