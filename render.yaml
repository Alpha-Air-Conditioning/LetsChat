services:
  - type: web
    name: letschat
    runtime: python
    buildCommand: "bash ./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: letschat-db
          property: connectionString

databases:
  - name: letschat-db
    plan: free
